<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar conta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card text-center shadow-sm" style="width: 20rem;">
        <div class="card-body d-flex flex-column gap-3 p-4">
            <h5 class="card-title fw-bold text-dark mb-2">Acessar Conta</h5>
            <input type="text" class="form-control" placeholder="Seu e-mail">
            <div class="input-group">
                <input type="password" class="form-control" placeholder="Sua senha">
                <button class="btn btn-outline-secondary" type="button" id="btnToggleSenha">
                    <i class="bi bi-eye" id="iconeOlho"></i>
                </button>
            </div>
            <div class="d-grid">
                <button class="btn btn-success fw-bold" type="button">Entrar</button>
            </div>
            <a href="#" class="text-decoration-none text-secondary">Esqueceu a senha?</a>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
